<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca Digital</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header>
      <div class="menu">
        <button
          class="hamburger"
          id="btn-menu"
          aria-expanded="false"
          aria-label="Abrir Menu"
        >
          <span class="line"></span>
          <span class="line"></span>
          <span class="line"></span>
        </button>

        <nav class="nav-links" id="menu-links">
          <ul>
            <li><a href="./dashboard.html">[Dashboard]</a></li>
            <li><a href="./publicacoes.html">[Publicações]</a></li>
            <li><a href="./relatorios.html">[Relatórios]</a></li>
            <li><a href="./configuracoes.html">[Configurações]</a></li>
          </ul>
        </nav>
      </div>
      <div class="header__title">
        <a href="./dashboard.html"><h1>[LOGO + NOME]</h1></a>
      </div>
    </header>
    <main>
      <section class="container">
        <div class="title underlined">
          <h2>[Nova Publicação]</h2>
        </div>
        <div class="card">
          <div class="field">
            <label for="titulo">Título:</label>
            <input
              type="text"
              name="titulo"
              id="titulo"
              placeholder="Digite o título..."
            />
          </div>
          <div class="field">
            <label for="autor">Autor:</label>
            <input
              type="text"
              name="autor"
              id="autor"
              placeholder="Digite o autor..."
            />
          </div>
          <div class="field">
            <label for="tipo">Tipo:</label>
            <select name="tipo" id="tipo">
              <option value="livro">[Livro]</option>
              <option value="revista">[Revista]</option>
            </select>
          </div>
          <div class="field">
            <label for="genero">Gênero:</label>
            <input
              type="text"
              name="genero"
              id="genero"
              placeholder="Ex: Ficção Científica"
            />
          </div>
          <div class="field">
            <label for="simultaneas">Ano:</label>
            <input
              type="number"
              name="ano"
              id="ano"
              placeholder="Digite o ano..."
            />
          </div>
          <div class="field">
            <label for="paginas">Páginas:</label>
            <input type="number" name="paginas" id="paginas" placeholder="0" />
          </div>
          <div class="field">
            <label for="tipo">Status inicial:</label>
            <select name="status" id="status">
              <option value="nao-lido">[Não Lido]</option>
              <option value="lendo">[Lendo]</option>
              <option value="lendo">[Lido]</option>
            </select>
          </div>
          <div class="field">
            <button class="btn" style="margin-top: 0.5rem">
              [SALVAR CONFIGURAÇÕES]
            </button>
          </div>
        </div>
      </section>
    </main>
    <footer>[Rodapé]</footer>
    <script src="../js/script.js"></script>
  </body>
</html>
