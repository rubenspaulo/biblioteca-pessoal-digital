<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca Digital</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <header>
      <div class="menu">
        <button
          class="hamburger"
          id="btn-menu"
          aria-expanded="false"
          aria-label="Abrir Menu"
        >
          <span class="line"></span>
          <span class="line"></span>
          <span class="line"></span>
        </button>

        <nav class="nav-links" id="menu-links">
          <ul>
            <li><a href="./dashboard.html">[Dashboard]</a></li>
            <li><a href="./publicacoes.html">[Publicações]</a></li>
            <li><a href="./relatorios.html">[Relatórios]</a></li>
            <li><a href="./configuracoes.html">[Configurações]</a></li>
          </ul>
        </nav>
      </div>
      <div class="header__title">
        <a href="./dashboard.html"><h1>Biblioteca Digital</h1></a>
      </div>
      <div class="header__actions">
        <a
          href="./nova-publicacao.html"
          class="fab"
          aria-label="Nova Publicação"
          title="Nova Publicação"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </a>
      </div>
    </header>
    <main>
      <section class="container">
        <div class="title underlined">
          <h2>>> Publicações</h2>
        </div>
        <div class="card">
          <div class="field">
            <label for="buscar">Buscar:</label>
            <input
              type="text"
              name="buscar"
              id="buscar"
              placeholder="Digite título ou autor..."
            />
          </div>
          <div class="filters">
            <div class="field">
              <label for="status">Status:</label>
              <select name="status" id="status">
                <option value="todos">[Todos]</option>
                <option value="nao-lido">[Não lido]</option>
                <option value="lendo">[Lendo]</option>
                <option value="lido">[Lido]</option>
              </select>
            </div>
            <div class="field">
              <label for="tipo">Tipo:</label>
              <select name="tipo" id="tipo">
                <option value="todos">[Todos]</option>
                <option value="livro">[Livro]</option>
                <option value="revista">[Revista]</option>
              </select>
            </div>
            <button class="btn">[Pesquisar]</button>
            <p>Mostrando: <strong>0</strong> de <strong>0</strong></p>
          </div>
        </div>
        <div class="empty">
          <p>[VAZIO]</p>
          <p>Nenhuma publicação cadastrada</p>
          <a href="./nova-publicacao.html" class="btn"
            >[+ ADICIONAR PRIMEIRA]</a
          >
        </div>
      </section>
    </main>
    <footer>[Rodapé]</footer>
    <script src="../js/script.js"></script>
  </body>
</html>
